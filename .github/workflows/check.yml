# The checks described in .github/check.py, on every push and pull request.
#
# KoLmafia's data files are fetched rather than vendored: defaults.txt says what
# an unset preference reads as, and monsters.txt and items.txt say what an id is.
# Copying them in would be three more numbers to keep in step, and tracking
# mafia's main is the point -- when KoL changes something and mafia follows, this
# is where we hear about it.
name: check
on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch KoLmafia's data files
        run: |
          mkdir -p "$RUNNER_TEMP/mafia-data"
          base=https://raw.githubusercontent.com/kolmafia/kolmafia/main/src/main/resources/data
          for f in defaults.txt monsters.txt items.txt; do
            curl -fsSL "$base/$f" -o "$RUNNER_TEMP/mafia-data/$f"
          done

      - name: check.py
        run: python3 .github/check.py --data "$RUNNER_TEMP/mafia-data"
